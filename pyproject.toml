[project]
name = "careerpilot"
version = "0.2.0"
description = "A student-first application workspace for verified jobs and evidence-aware resumes."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "cryptography>=46,<47",
    "email-validator>=2.3,<3",
    "fastapi>=0.128,<1",
    "gunicorn>=23,<24",
    "httpx>=0.28,<1",
    "langgraph==0.6.4",
    "mcp>=1.13,<3",
    "passlib[argon2]>=1.7.4,<2",
    "psycopg2-binary>=2.9.11,<3",
    "pydantic>=2.11,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.1,<2",
    "python-jose[cryptography]>=3.5,<4",
    "python-multipart>=0.0.21,<1",
    "reportlab>=4.4,<5",
    "requests>=2.32,<3",
    "scikit-learn==1.7.2",
    "sqlalchemy>=2.0.43,<3",
    "tavily-python>=0.7.17,<1",
    "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
analysis = [
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "nltk>=3.9,<4",
    "numpy>=2.3,<3",
    "pandas>=2.3,<3",
    "scikit-learn==1.7.2",
    "seaborn>=0.13,<1",
]
